[package]
name = "bls-bench"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Abhishek Khaparde <khapardehuf@gmail.com>"]

[dependencies]
bls12_381 = { workspace = true }
sha2 = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true, features = ["std"] }
borsh = { workspace = true, features = ["std"] }
risc0-zkvm = { workspace = true, features = ["std", "client"] }
risc0-binfmt = "=3.0.5"
risc0-zkos-v1compat = "=2.2.2"

[[bin]]
name = "bls_measure"
path = "src/main.rs"
