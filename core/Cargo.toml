[package]
name = "attest-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Abhishek Khaparde <khapardehuf@gmail.com>"]

[features]
default = ["std"]
std = ["borsh/std", "hex/std"]
serde = ["dep:serde", "hex"]

[dependencies]
borsh = { workspace = true }
tiny-keccak = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
alloy-trie = { version = "=0.9.8", default-features = false, features = ["ethereum"] }
alloy-rlp = { version = "=0.3.16", default-features = false }
alloy-primitives = { version = "=1.7.3", default-features = false }
nybbles = { version = "=0.4.8", default-features = false }

[dev-dependencies]
serde_json = "1.0"
hex = "0.4"
