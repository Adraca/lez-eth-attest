[workspace]
members = [
    "core",
    "program",
    "host",
    "consumers",
    "bls-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Abhishek Khaparde <khapardehuf@gmail.com>"]

[workspace.dependencies]
borsh = { version = "1.5", default-features = false, features = ["derive"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
sha2 = { version = "=0.10.8", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
risc0-zkvm = { version = "=3.0.5", default-features = false }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "db66590ab821a4e142c211017a3866d007f6fa77" }
bls12_381 = { version = "0.8.0", default-features = false, features = ["alloc", "experimental", "groups", "pairings"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", tag = "bls12_381/v0.8.0-risczero.1" }
